name: Generate Block Finder Statistics

on:
  workflow_dispatch: # run only manual

permissions:
  contents: write

jobs:
    generate-statistics:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Python
              uses: actions/setup-python@v5
              with:
                python-version: "3.x"

            - name: Install dependencies
              run: pip install requests plotly kaleido

            - name: Generate charts
              run: python _scripts/block-finder-stats.py

            - name: Commit generated images
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                git add assets/img/block-finder-statistics/

                if git diff --cached --quiet; then
                    echo "No changes to commit."
                else
                    git commit -m "Update Block Finder statistics"
                    git push
                fi
