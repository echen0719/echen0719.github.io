<div id="download-progress" style="display:none; margin-bottom:15px;">
    <progress id="download-bar" value="0" max="100" style="width:100%;"></progress>
    <div id="download-text" style="color:#eee; font-size:14px; margin-top:4px;">
        Downloading...
    </div>
</div>

<script>
// indexedDB for storing larger files
const conf = {
    repo: "kgurchiek/Minecraft-Server-Scanner",
    path: "ips",
    branch: "main",
    dbName: "minecraft-servers-list-data",
    storeName: "ipsData"
};

// https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(conf.dbName, 1);

        // download if don't have
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(conf.storeName)) {
                db.createObjectStore(conf.storeName, {keyPath: "id"});
            }
        };

        request.onsuccess = (event) => {
            resolve(event.target.result);
        };
        request.onerror = (event) => {
            console.log("Man, your browser is kinda goofy...");
            reject(event.target.error);
        };
    });
}

async function getCache() { // promises prevent hold ups (async)
    const db = await openDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction([conf.storeName], "readonly");
        const store = transaction.objectStore(conf.storeName);
        const request = store.get("latest");

        request.onsuccess = () => {
            resolve(request.result ?? null);
        };
        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function saveCache(commitDate, sha, arrayBuffer) {
    const db = await openDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction([conf.storeName], "readwrite");
        const store = transaction.objectStore(conf.storeName);
        const request = store.put({id: "latest", commitDate, sha, data: arrayBuffer}); // data necessary for id

        request.onsuccess = () => {
            resolve();
        };
        request.onerror = () => {
            reject(request.error);
        };
    });
}

function parseIPs(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    const servers = [];
    const byteLength = view.byteLength;

    // provided file is in format of repeating 6 bytes
    // where first 4 bytes is ip, as in 11000000 10101000 00000001 00000001 = 192.168.1.1
    // and last 2 bytes of 6 is port in big-endian

    for (let i = 0; i + 6 <= byteLength; i += 6) {
        const b1 = view.getUint8(i);
        const b2 = view.getUint8(i + 1);
        const b3 = view.getUint8(i + 2);
        const b4 = view.getUint8(i + 3);
        const ip = `${b1}.${b2}.${b3}.${b4}`;
        const port = view.getUint16(i + 4, false); // false is big-endian

        servers.push({ip, port});
    }

    return servers;
}

async function getMinecraftServers() { // ported from my python file
    try {
        const contentFetch = await fetch(`https://api.github.com/repos/${conf.repo}/contents/${conf.path}?ref=${conf.branch}`);
        if (!contentFetch.ok) throw new Error(`Failed to fetch content metadata: ${contentFetch.status}`);

        const contentData = await contentFetch.json();
        const remoteSHA = contentData.sha
        const downloadURL = contentData.download_url

        const cached = await getCache();
        if (cached && cached.sha === remoteSHA) {
            console.log(`Cache is up to date. Using the cached data from: ${cached.commitDate}`);
            return parseIPs(cached.data);
        }

        let commitDate = null;
        const commitsFetch = await fetch(`https://api.github.com/repos/${conf.repo}/commits?path=${conf.path}&sha=${conf.branch}&per_page=1`);
        if (!commitsFetch.ok) throw new Error(`Failed to fetch commit metadata: ${commitsFetch.status}`);

        const commitsData = await commitsFetch.json();
        for (const commit of commitsData) {
            const commitDetails = await fetch(`https://api.github.com/repos/${conf.repo}/commits/${commit.sha}`);
            if (!commitDetails.ok) continue;

            const commitData = await commitDetails.json();
            const fileRecord = commitData.files?.find(file => file.filename === conf.path && file.sha === remoteSHA);

            if (fileRecord) {
                commitDate = commitData.commit.committer.date;
                break;
            }
        }

        if (!commitDate) {
            commitDate = new Date().toISOString();
        }

        console.log("Fetching remote file now...");
        const downloadFetch = await fetch(downloadURL);
        if (!downloadFetch.ok) throw new Error(`Failed to download file: ${downloadFetch.status}`);

        const arrayBuffer = await downloadFetch.arrayBuffer();
        await saveCache(commitDate, remoteSHA, arrayBuffer);

        return parseIPs(arrayBuffer);
    }
    catch (error) {
        console.log("Can't find Minecraft server list file...Change your browser network settings?");

        // fallback
        const cached = await getCache();
        if (cached) {
            return parseIPs(cached.data);
        }

        throw new Error("Yeah...good luck...Sorry....");
    }
}
</script>
