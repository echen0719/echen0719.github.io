<script>
// indexedDB for storing larger files
const conf = {
    repo: "kgurchiek/Minecraft-Server-Scanner",
    path: "ips",
    ref: "main",
    dbName: "minecraft-servers-list-data",
    storeName: "ipsData"
};

// https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API/Using_IndexedDB
function openDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(conf.dbName, 1);

        // download if don't have
        request.onupgradeneeded = (event) => {
            const db = event.target.result;
            if (!db.objectStoreNames.contains(conf.storeName)) {
                db.createObjectStore(conf.storeName, {keyPath: "id"});
            }
        };

        request.onsuccess = (event) => {
            resolve(event.target.result);
        };
        request.onerror = (event) => {
            console.log("Man, your browser is kinda goofy...");
            reject(event.target.error);
        };
    });
}

async function getCache() { // promises prevent hold ups (async)
    const db = await openDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction([conf.storeName], "readonly");
        const store = transaction.objectStore(conf.storeName);
        const request = store.get("latest");

        request.onsuccess = () => {
            resolve(request.result ?? null);
        };
        request.onerror = () => {
            reject(request.error);
        };
    });
}

async function saveCache(commitDate, arrayBuffer) {
    const db = await openDB();

    return new Promise((resolve, reject) => {
        const transaction = db.transaction([conf.storeName], "readwrite");
        const store = transaction.objectStore(conf.storeName);
        const request = store.put({id: "latest", commitDate, data: arrayBuffer}); // data necessary for id

        request.onsuccess = () => {
            resolve();
        };
        request.onerror = () => {
            reject(request.error);
        };
    });
}

function parseIPs(arrayBuffer) {
    const view = new DataView(arrayBuffer);
    const servers = [];
    const byteLength = view.byteLength;

    // provided file is in format of repeating 6 bytes
    // where first 4 bytes is ip, as in 11000000 10101000 00000001 00000001 = 192.168.1.1
    // and last 2 bytes of 6 is port in big-endian

    for (let i = 0; i + 6 <= byteLength; i += 6) {
        const b1 = view.getUint8(i);
        const b2 = view.getUint8(i + 1);
        const b3 = view.getUint8(i + 2);
        const b4 = view.getUint8(i + 3);
        const ip = `${b1}.${b2}.${b3}.${b4}`;
        const port = view.getUint16(i + 4, false); // false is big-endian

        servers.push({ip, port});
    }

    return servers;
}

</script>
