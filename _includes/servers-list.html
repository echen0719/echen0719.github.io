<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
.controls,
.bottom-controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
}

.search-box,
.custom-api-box,
.worker-count-box {
    flex: 1;
    min-width: 250px;
    padding: 12px;
    background: #2a2a2a;
    border: 1px solid steelblue;
    border-radius: 6px;
    color: #eee;
    font-size: 14px;
}

.page-size,
.refresh-button,
.start-button,
.stop-button {
    padding: 12px 16px;
    background: #2a2a2a;
    border-radius: 6px;
    color: #eee;
    font-size: 14px;
}

.refresh-button,
.start-button,
.stop-button {
    background: darkslategray;
}

.view-json-button:hover,
.refresh-button:hover,
.start-button:hover,
.stop-button:hover {
    border: 2px solid steelblue;
}

button:disabled {
    background: #1a1a1a;
    color: #666;
    cursor: not-allowed;
    opacity: 0.6;
}

button:disabled:hover {
    border: 2px solid transparent;
}

.checkbox-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #eee;
    white-space: nowrap;
}

.server-card {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 15px;
        display: flex;
        gap: 15px;
        transition: transform 0.2s;
    }

.server-card:hover {
    border-color: steelblue;
}

.server-icon {
    width: 64px;
    height: 64px;
    border-radius: 4px;
    object-fit: cover;
}
</style>

<div class="controls">
    <input type="text" class="search-box"  id="search-box" placeholder="Search by IP or version...">

    <select class="page-size" id="page-size">
        <option value="25">25 per page</option>
        <option value="50" selected>50 per page</option>
        <option value="100">100 per page</option>
        <option value="500">500 per page</option>
    </select>

    <label class="checkbox-label">
        <input type="checkbox" id="show-offline">
        <span style="color: #eee">Show Offline</span>
    </label>

    <label class="checkbox-label">
        <input type="checkbox" id="have-players-toggle">
        <span style="color: #eee">Have Players?</span>
    </label>

    <button class="refresh-button" id="refresh-button">Refresh Servers</button>
</div>

<div class="bottom-controls">
    <label class="checkbox-label">
        <input type="checkbox" id="random-toggle" checked>
        <span style="color: #eee">Randomizer</span>
    </label>

    <label class="checkbox-label">
        <input type="checkbox" id="custom-api-toggle" checked>
        <span style="color: #eee">Custom API</span>
    </label>

    <input type="text" class="custom-api-box"  id="custom-api-box" placeholder="Custom api address (e.g. 127.0.0.1:6767/scan)">
    <input type="text" class="worker-count-box"  id="worker-count-box" placeholder="Specify number of workers (default: 10)">

    <button class="start-button" id="start-button">Start</button>
    <button class="stop-button" id="stop-button">Stop</button>
</div>

<div class="server-list" id="server-list" style="color: #eee">Loading...</div>

<div class="pagination-controls" style="display: flex; align-items: center; justify-content: center;">
    <button class="refresh-button" id="previous-page">Previous</button>
    <span id="page-info" style="color: white; min-width: 120px; text-align: center; padding: 0 15px">Page 1 / 1</span>
    <button class="refresh-button" id="next-page">Next</button>
</div>

<script>
let servers = [];
let filteredServers = [];
let displayedServers = [];

let serverStatuses = {}; // caching api results
let pendingPings = new Set();
let stopRequested = false; // flag to gracefully exit instead

let currentPage = 1;
let totalPages = 1;
let pageSize = 50;
let pinging = false;
let concurrentPings = 10; // worker count
let scanIndex = 0;

function loadPreferences() {
    const savedRandom = localStorage.getItem('pref-mc-server-scanner-random');
    if (savedRandom !== null) {
        document.getElementById('random-toggle').checked = savedRandom === 'true';
    }
    const savedOffline = localStorage.getItem('pref-mc-server-scanner-offline');
    if (savedOffline !== null) {
        document.getElementById('show-offline').checked = savedOffline === 'true';
    }

    const savedHavePlayers = localStorage.getItem('pref-mc-server-scanner-have-players');
    if (savedHavePlayers !== null) {
        document.getElementById('have-players-toggle').checked = savedHavePlayers === 'true';
    }

    const savedAPIToggle = localStorage.getItem('pref-mc-server-scanner-custom-api-toggle');
    if (savedAPIToggle !== null) {
        const isToggledOn = savedAPIToggle === 'true'; // convert string to boolean
        document.getElementById('custom-api-toggle').checked = isToggledOn;
        document.getElementById('custom-api-box').disabled = !isToggledOn;
    }

    const savedAPI= localStorage.getItem('pref-mc-server-scanner-custom-api');
    if (savedAPI !== null) {
        document.getElementById('custom-api-box').value = savedAPI;
    }

    const savedWorkers = localStorage.getItem('pref-mc-server-scanner-workers');
    if (savedWorkers !== null) {
        const value = parseInt(savedWorkers);
        if (!isNaN(value) && value > 0) {
            document.getElementById('worker-count-box').value = value;
            concurrentPings = value;
        }
    }
}

// save for future usage
function savePreferences() {
    localStorage.setItem('pref-mc-server-scanner-random', document.getElementById('random-toggle').checked);
    localStorage.setItem('pref-mc-server-scanner-offline', document.getElementById('show-offline').checked);
    localStorage.setItem('pref-mc-server-scanner-have-players', document.getElementById('have-players-toggle').checked);

    localStorage.setItem('pref-mc-server-scanner-custom-api-toggle', document.getElementById('custom-api-toggle').checked);
    localStorage.setItem('pref-mc-server-scanner-custom-api', document.getElementById('custom-api-box').value);

    localStorage.setItem('pref-mc-server-scanner-workers', document.getElementById('worker-count-box').value);
}

function updatePingButtons() {
    const startButton = document.getElementById('start-button');
    const stopButton = document.getElementById('stop-button');

    if (pinging) { // mutually exclusive behavior
        startButton.disabled = true;
        stopButton.disabled = false;
    }
    else {
        startButton.disabled = false;
        stopButton.disabled = true;
    }
}

async function init() {
    document.getElementById('server-list').innerHTML = `<p style="color: #eee;">Loading...</p>`;
    loadPreferences();
    updatePingButtons();

    // listeners for if the user changes while pinging
    document.getElementById('search-box').addEventListener('input', () => {handleFilterChange();});

    document.getElementById('page-size').addEventListener('change', (e) => {
        pageSize = parseInt(e.target.value);
        currentPage = 1;
        render();
    });

    document.getElementById('show-offline').addEventListener('change', () => {
        savePreferences();
        render();
    });

    document.getElementById('have-players-toggle').addEventListener('change', () => {
        savePreferences();
        render();
    });

    document.getElementById('refresh-button').addEventListener('click', () => {
        cancelPings();
        serverStatuses = {};
        scanIndex = 0;
        render();
    });

    document.getElementById('random-toggle').addEventListener('change', () => {
        savePreferences();
        // prepareResults();
        // render();
    });

    // scan list is cleared when api is changed
    document.getElementById('custom-api-toggle').addEventListener('change', () => {
        const isChecked = document.getElementById('custom-api-toggle').checked;
        document.getElementById('custom-api-box').disabled = !isChecked;

        savePreferences();
        cancelPings();
        serverStatuses = {};
        scanIndex = 0;
        render();
    });

    let debounce;
    document.getElementById('custom-api-box').addEventListener('input', () => {
        savePreferences();

        clearTimeout(debounce);
        debounce = setTimeout(() => {
            cancelPings();
            serverStatuses = {};
            scanIndex = 0;
            render();
        }, 500);
    });

    document.getElementById('worker-count-box').addEventListener('input', (e) => {
        const value = parseInt(e.target.value);
        if (!isNaN(value) && value > 0) {
            concurrentPings = value;
        }
        savePreferences();
    });

    document.getElementById('start-button').addEventListener('click', () => {
        if (!pinging) {
            pingVisible();
        }
    });

    document.getElementById('stop-button').addEventListener('click', () => {
        cancelPings();
    });

    document.getElementById('previous-page').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            render();
        }
    });

    document.getElementById('next-page').addEventListener('click', () => {
        if (currentPage < totalPages) {
            currentPage++;
            render();
        }
    });

    try {
        const result = await getMinecraftServers();
        servers = result.servers;
        setInfo(servers.length, new Date(result.commitDate).toLocaleString());
    }
    catch (err) {
        document.getElementById('server-list').innerHTML = `<p style="color: red;">Error loading scan: ${err.message}</p>`;
    }
    prepareResults();
    render();
}

function setInfo(count, date) {
    document.getElementById('server-count').textContent = count;
    document.getElementById('scan-time').textContent = date;
}

function handleFilterChange() {
    cancelPings();
    prepareResults();
    render();
}

function cancelPings() {
    stopRequested = true;
    document.getElementById('stop-button').disabled = true;
}

function prepareResults() {
    const randomMode = document.getElementById('random-toggle').checked;
    const searchTerm = document.getElementById('search-box').value.toLowerCase();

    let filtered = servers.filter(server =>
        (server.ip && server.ip.toLowerCase().includes(searchTerm)) ||
        (server.version && server.version.toLowerCase().includes(searchTerm))
    );

    if (randomMode) {
        filtered = filtered.sort(() => Math.random() - 0.5); // using this because it is easier
    }

    filteredServers = filtered;
    currentPage = 1;
    scanIndex = 0;
}

function findNextUnpinged() {
    while (scanIndex < filteredServers.length) {
        const server = filteredServers[scanIndex];
        scanIndex++;
        const key = `${server.ip}:${server.port}`;
        if (!serverStatuses[key] && !pendingPings.has(key)) {
            return server;
        }
    }
    return null;
}

function render() {
    const serverListDiv = document.getElementById('server-list');
    const showOffline = document.getElementById('show-offline').checked;
    const havePlayers = document.getElementById('have-players-toggle').checked;

    let visibleServers = [];
    for (let i = 0; i < filteredServers.length; i++) {
        const server = filteredServers[i];
        const key = `${server.ip}:${server.port}`;
        const status = serverStatuses[key];

        if (status) {
            if (!showOffline && !status.online) continue;
            if (havePlayers && (!status.online || (status.players?.online || 0) < 1)) continue;
        }
        visibleServers.push(server);
    }

    totalPages = Math.ceil(visibleServers.length / pageSize) || 1;
    if (currentPage > totalPages) {
        currentPage = totalPages;
    }

    const startIndex = (currentPage - 1) * pageSize;
    const endIndex = startIndex + pageSize;
    displayedServers = visibleServers.slice(startIndex, endIndex); // what users see

    if (displayedServers.length === 0) {
        serverListDiv.innerHTML = `<p style="color: red;">No servers found matching search.</p>`;
        return;
    }

    serverListDiv.innerHTML = '';

    displayedServers.forEach(server => {
        const key = `${server.ip}:${server.port}`;
        const status = serverStatuses[key];

        const card = document.createElement('div');
        card.className = 'server-card';

        let iconHtml = `<div class="server-icon">No Icon</div>`;
        let detailsHtml = `<div><strong style="color: #eee;">${key}</strong><br><span style="color: #eee;">Pinging server status...</span></div>`;
        let buttonHtml = "";

        if (status) {
            buttonHtml = `<button class="view-json-button" style="margin-left: auto; height: fit-content; border-radius: 4px;" onclick="viewRawJson('${key}')">View Raw JSON</button>`;

            if (status.online) {
                if (status.icon) {
                    iconHtml = `<img src="${status.icon}" class="server-icon" alt="icon">`;
                }
                else {
                    iconHtml = `<img src="/assets/img/pack.png" class="server-icon" alt="icon">`;
                }

                let motd = 'No MOTD provided';
                if (status.motd) {
                    if (Array.isArray(status.motd.html)) {
                        motd = status.motd.html.join('<br>');
                    }
                    else if (typeof status.motd.html === 'string') {
                        motd = status.motd.html;
                    }
                    else if (Array.isArray(status.motd.clean)) {
                        motd = status.motd.clean.join('<br>');
                    }
                    else if (typeof status.motd.clean === 'string') {
                        motd = status.motd.clean;
                    }
                }

                const currentPlayers = status.players?.online || 0;
                const maxPlayers = status.players?.max || 0;
                const gameVersion = status.version || "Unknown";

                detailsHtml = `
                    <div>
                        <strong style="color: #eee;">${key}</strong> <span style="color: lime;">[Online]</span><br>
                        <span style="color: #eee;">Version: ${gameVersion}</span><br>
                        <span style="color: #eee;">Players: ${currentPlayers}/${maxPlayers}</span><br>
                        <div style="margin-top: 5px; font-family: monospace; background: #888888; padding: 4px; border-radius: 4px;">${motd}</div>
                    </div>
                `;
            }
            else {
                card.style.opacity = '0.5';
                card.style.border = '1px dashed red';
                detailsHtml = `<div><strong style="color: #eee;">${key}</strong> <span style="color: red;">Offline</span></div>`;
            }
        }

        card.innerHTML = iconHtml + detailsHtml + buttonHtml;
        serverListDiv.appendChild(card);
    });

    document.getElementById('page-info').textContent = `Page ${currentPage} / ${totalPages}`;
}

const backupAPI = "https://api.mcsrvstat.us/3";

function viewRawJson(key) { // add api open instead in future
    window.open(`https://api.mcsrvstat.us/3/${key}`, '_blank');
}

function getCustomAPI() {
    const isChecked = document.getElementById('custom-api-toggle').checked;
    const customAPIValue = document.getElementById('custom-api-box').value.trim();

    if (isChecked && customAPIValue) {
        let url = customAPIValue;

        // auto add http
        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'http://' + url;
        }

        return url;
    }
    return null;
}

async function ping(ip, port) {
    const key = `${ip}:${port}`;
    const maxRetries = 2;
    const API = getCustomAPI();
    const endpoints = API ? [API, backupAPI] : [backupAPI];

    for (const endpoint of endpoints) {
        for (let i = 0; i < maxRetries; i++) {
            if (stopRequested) return; // prevent new requests during stop
            try {
                const response = await fetch(`${endpoint}/${key}`, {signal: AbortSignal.timeout(10000)});
                if (!response.ok) throw new Error('API or request error');
                const data = await response.json();

                serverStatuses[key] = data;
                return data;
            }
            catch (e) {
                if (stopRequested) return;
                if (i < maxRetries - 1) {
                    await new Promise(resolve => setTimeout(resolve, 500));
                }
            }
        }
    }

    if (!stopRequested) {
        serverStatuses[key] = {online: false}; // both servers failed
    }
}

async function pingVisible() {
    if (pinging) return;
    pinging = true;

    updatePingButtons();
    stopRequested = false;

    let renderTimeout;
    async function worker() {
        while (!stopRequested) {
            let nextServer = null;
            let nextKey = null;

            while (scanIndex < filteredServers.length) {
                const server = filteredServers[scanIndex];
                const key = `${server.ip}:${server.port}`;
                scanIndex++;

                if (!serverStatuses[key] && !pendingPings.has(key)) {
                    nextServer = server;
                    nextKey = key;
                    break;
                }
            }

            if (!nextServer) {
                break;
            }

            pendingPings.add(nextKey);
            await ping(nextServer.ip, nextServer.port);
            pendingPings.delete(nextKey); // which has much safer handling

            if (!stopRequested) {
                clearTimeout(renderTimeout);
                renderTimeout = setTimeout(render, 150); // prevent massive updates
            }
        }
    }

    const workers = [];
    const poolSize = Math.min(concurrentPings, filteredServers.length);
    for (let i = 0; i < poolSize; i++) {
        workers.push(worker());
    }

    try {
        await Promise.all(workers);
    }
    catch(e) {
        console.error("Ping workers error:", e);
    }
    finally {
        pinging = false;
        stopRequested = false;
        updatePingButtons();
        clearTimeout(renderTimeout);
        render();
    }
}

init();
</script>
