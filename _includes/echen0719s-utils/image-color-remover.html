<style>
.image-color-remover-container {
    width: 80%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.image-panels {
    display: flex;
    gap: 20px;
}

.image-panel {
    position: relative;
}

canvas {
    width: 100%;
    height: 225px;
    border: 2px solid black;
    display: block;
}

.upload-widgets, .download-widgets {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
}

.image-change {
    width: calc((100% - 20px) / 2);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.image-options {
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
}

.image-options label {
    white-space: nowrap;
    margin-top: 2px;
}

.image-options input {
    height: 30px;
}
</style>

<div class="image-color-remover-container">
    <h3 style="text-align: center;">Remove Color From Image</h3>

    <div class="image-panels">
        <div class="image-panel">
            <canvas class="input"></canvas>

            <div class="upload-widgets">
                <label for="fileInput1"><strong>Upload Image:</strong></label>
                <input id="fileInput1" type="file" name="file" accept="image/*" hidden>
                <button type="button" onclick="document.getElementById('fileInput1').click()">Browse...</button>
            </div>
        </div>

        <div class="image-panel">
            <canvas class="output"></canvas>

            <div class="download-widgets">

            </div>
        </div>
    </div>

    <div class="image-change" style="display: none;">
        <label for="fileInput2"><strong>Choose another image:</strong></label>
        <input id="fileInput2" type="file" name="file" accept="image/*" hidden>
        <button type="button" onclick="document.getElementById('fileInput2').click()">Browse...</button>
    </div>

    <div class="image-options">
        <label for="colorBeforeInput"><strong>Color to remove:</strong></label>
        <input type="text" id="colorBeforeInput" placeholder="rgba(255, 255, 255)" >

        <label for="colorAfterInput"><strong>Color to replace:</strong></label>
        <input type="text" id="colorAfterInput" placeholder="rgba(0, 0, 0, 0)">

        <button id="inputConfirm" type="button" onclick="">Submit</button>
    </div>
</div>

<script>
const fileInput1 = document.getElementById("fileInput1");
const fileInput2 = document.getElementById("fileInput2");

const inputCanvas = document.querySelector("canvas.input");
const inputContext = inputCanvas.getContext("2d");

const uploadWidget = document.querySelector(".upload-widgets");
const imageChange = document.querySelector(".image-change");

function loadImage(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (event) {
        const image = new Image();

        image.onload = function () {
            inputCanvas.width = image.naturalWidth;
            inputCanvas.height = image.naturalHeight;

            inputContext.clearRect(0, 0, inputCanvas.width, inputCanvas.height);
            inputContext.drawImage(image, 0, 0, inputCanvas.width, inputCanvas.height);

            uploadWidget.style.display = "none";
            imageChange.style.display = "flex";
        };

        image.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

fileInput1.addEventListener("change", function () {
    loadImage(this.files[0]);
});

fileInput2.addEventListener("change", function () {
    loadImage(this.files[0]);
});
</script>
