</script> <style>.word-count-container{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}</style> <div class="word-count-container"> <h3 style="text-align: center;">Word Counter</h3> <div> <span id="words" style="font-weight: bold;">0</span> Words | <span id="characters" style="font-weight: bold;">0</span> Characters | <span id="sentences" style="font-weight: bold;">0</span> Sentences </div> <textarea style="border: 2px solid black" id="text" rows="10" cols="80" placeholder="Type or paste your text here..." autocomplete="off"></textarea> <div class="buttons"> <input id="fileInput" type="file" hidden=""> <button onclick="loadFile()">Load file</button> <button onclick="clearText()">Clear text</button> </div> <p></p> </div> <script>
const text = document.getElementById("text");
const words = document.getElementById("words");
const characters = document.getElementById("characters");
const sentences = document.getElementById("sentences");
const fileInput = document.getElementById("fileInput");

text.addEventListener("input", updateCount);

function updateCount() {
    const value = text.value;
    characters.textContent = value.length;

    // equivalent of "\\S+"
    let wordCount = value.trim().match(/\S+/g);
    words.textContent = wordCount ? wordCount.length : 0; // one-line if else statement

    // count number of punctuation (excluding spaces)
    let sentenceCount = value.trim().match(/[.!?]+/g);
    sentences.textContent = sentenceCount ? sentenceCount.length : 0;
}

function loadFile() {
    fileInput.click()
}

fileInput.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (event) {
        text.value = event.target.result;
        updateCount();
    };

    reader.onerror = function () {
        console.log("Unable to read this file.");
    };

    reader.readAsText(file);

    this.value = "";
});

function clearText() {
    text.value = "";
    updateCount();
}

<label for="image-color-remover-before-alpha">Transparency:</label> <input type="range" id="image-color-remover-before-alpha" min="0" max="1" step="0.01" value="1"> </div> <div> <label for="image-color-remover-color-after-input"><strong>Color to replace:</strong></label> <input type="color" id="image-color-remover-color-after-input"> <label for="image-color-remover-after-alpha">Transparency:</label> <input type="range" id="image-color-remover-after-alpha" min="0" max="1" step="0.01" value="1"> </div> <button id="image-color-remover-input-confirm" type="button">Submit</button> </div> </div> <script>
const imageColorRemoverFileInput = document.getElementById("image-color-remover-file-input");

const imageColorRemoverInputCanvas = document.querySelector("canvas.image-color-remover-canvas-input");
const imageColorRemoverInputContext = imageColorRemoverInputCanvas.getContext("2d");

const imageColorRemoverOutputCanvas = document.querySelector("canvas.image-color-remover-canvas-output");
const imageColorRemoverOutputContext = imageColorRemoverOutputCanvas.getContext("2d");

const imageColorRemoverImageChange = document.querySelector(".image-color-remover-image-change");

// all the bottom inputs
const imageColorRemoverColorBeforeInput = document.getElementById("image-color-remover-color-before-input");
const imageColorRemoverBeforeAlphaInput = document.getElementById("image-color-remover-before-alpha");
const imageColorRemoverColorAfterInput = document.getElementById("image-color-remover-color-after-input");
const imageColorRemoverAfterAlphaInput = document.getElementById("image-color-remover-after-alpha");

const imageColorRemoverInputConfirm = document.getElementById("image-color-remover-input-confirm");

let imageColorRemoverCurrentImage = null;

function imageColorRemoverLoadImage(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (event) {
        const image = new Image();

        image.onload = function () {
            imageColorRemoverCurrentImage = image;

            imageColorRemoverInputCanvas.width = image.naturalWidth;
            imageColorRemoverInputCanvas.height = image.naturalHeight;

            imageColorRemoverInputContext.clearRect(0, 0, imageColorRemoverInputCanvas.width, imageColorRemoverInputCanvas.height);
            imageColorRemoverInputContext.drawImage(image, 0, 0, imageColorRemoverInputCanvas.width, imageColorRemoverInputCanvas.height);

            imageColorRemoverOutputCanvas.width = image.naturalWidth;
            imageColorRemoverOutputCanvas.height = image.naturalHeight;

            imageColorRemoverProcessImage();
        };

        image.src = event.target.result;
    };

    reader.readAsDataURL(file);
}

/*
const data looks

[r, g, b, a, r, g, b, a] = 2 pixels
*/

function imageColorRemoverProcessImage() {
    if (!imageColorRemoverCurrentImage) return;

    imageColorRemoverOutputContext.clearRect(0, 0, imageColorRemoverOutputCanvas.width, imageColorRemoverOutputCanvas.height);
    imageColorRemoverOutputContext.drawImage(imageColorRemoverCurrentImage, 0, 0);

    const imageData = imageColorRemoverOutputContext.getImageData(0, 0, imageColorRemoverOutputCanvas.width, imageColorRemoverOutputCanvas.height);
    const data = imageData.data;

    const colorBefore = hexToRGB(imageColorRemoverColorBeforeInput.value);
    const alphaBefore = parseFloat(imageColorRemoverBeforeAlphaInput.value);
    const colorAfter = hexToRGB(imageColorRemoverColorAfterInput.value);
    const alphaAfter = parseFloat(imageColorRemoverAfterAlphaInput.value);

    for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];
        const a = data[i + 3] / 255;

        // if match target, change
        if (r === colorBefore.r && g === colorBefore.g && b === colorBefore.b) {
            data[i] = colorAfter.r;
            data[i + 1] = colorAfter.g;
            data[i + 2] = colorAfter.b;
            data[i + 3] = alphaAfter * 255;
        }
    }

    imageColorRemoverOutputContext.putImageData(imageData, 0, 0);
}

imageColorRemoverFileInput.addEventListener("change", function () {
    imageColorRemoverLoadImage(this.files[0]);
});

imageColorRemoverInputConfirm.addEventListener("click", imageColorRemoverProcessImage);
imageColorRemoverColorBeforeInput.addEventListener("input", imageColorRemoverProcessImage);
imageColorRemoverBeforeAlphaInput.addEventListener("input", imageColorRemoverProcessImage);
imageColorRemoverColorAfterInput.addEventListener("input", imageColorRemoverProcessImage);
imageColorRemoverAfterAlphaInput.addEventListener("input", imageColorRemoverProcessImage);
</script> </article> </div> </div> <footer class="fixed-bottom" role="contentinfo"> <div class="container mt-0"> © Copyright 2026 echen0719 . </div> </footer> <script src="https://cdn.jsdelivr.net/npm/jquery@3.6.0/dist/jquery.min.js" integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4=" crossorigin="anonymous"></script> <script src="/assets/js/bootstrap.bundle.min.js"></script> <script src="https://cdn.jsdelivr.net/npm/mdbootstrap@4.20.0/js/mdb.min.js" integrity="sha256-NdbiivsvWt7VYCt6hYNT3h/th9vSTL4EDWeGs5SN3DA=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/masonry-layout@4.2.2/dist/masonry.pkgd.min.js" integrity="sha256-Nn1q/fx0H7SNLZMQ5Hw5JLaTRZp0yILA/FRexe19VdI=" crossorigin="anonymous"></script> <script defer src="https://cdn.jsdelivr.net/npm/imagesloaded@5.0.0/imagesloaded.pkgd.min.js" integrity="sha256-htrLFfZJ6v5udOG+3kNLINIKh2gvoKqwEhHYfTTMICc=" crossorigin="anonymous"></script> <script defer src="/assets/js/masonry.js?a0db7e5d5c70cc3252b3138b0c91dcaf" type="text/javascript"></script> <script defer src="https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist/medium-zoom.min.js" integrity="sha256-ZgMyDAIYDYGxbcpJcfUnYwNevG/xi9OHKaR/8GK+jWc=" crossorigin="anonymous"></script> <script defer src="/assets/js/zoom.js?85ddb88934d28b74e78031fd54cf8308"></script> <script defer src="https://cdn.jsdelivr.net/npm/bootstrap-table@1.22.4/dist/bootstrap-table.min.js" integrity="sha256-4rppopQE9POKfukn2kEvhJ9Um25Cf6+IDVkARD0xh78=" crossorigin="anonymous"></script> <script src="/assets/js/no_defer.js?2781658a0a2b13ed609542042a859126"></script> <script defer src="/assets/js/common.js?e0514a05c5c95ac1a93a8dfd5249b92e"></script> <script defer src="/assets/js/copy_code.js?c8a01c11a92744d44b093fc3bda915df" type="text/javascript"></script> <script defer src="/assets/js/jupyter_new_tab.js?d9f17b6adc2311cbabd747f4538bb15f"></script> <script defer type="text/javascript" id="MathJax-script" src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es
